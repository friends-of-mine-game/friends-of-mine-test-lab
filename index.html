<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends of Mine · Test Lab</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><strong>FRIENDS OF MINE</strong><span>TEST LAB</span></header><section id="start" class="card"><h1 id="title">Cargando test…</h1><p id="intro"></p><p id="draftNotice" class="notice hidden"></p><label>Tu nombre o alias (opcional)<input id="participant" placeholder="Ej. Alex"></label><div class="actions"><button id="begin">Empezar</button><button id="resetDraft" class="secondary hidden">Borrar borrador</button></div></section><section id="quiz" class="card hidden"><div class="progress"><span id="progressText"></span><div><i id="progressBar"></i></div></div><p id="section" class="eyebrow"></p><h2 id="question"></h2><p id="context" class="context"></p><div id="answers"></div><fieldset class="confidence"><legend>Confianza en tu respuesta (1–5)</legend><div id="confidence"></div></fieldset><div id="whyWrap" class="hidden"><label>¿Por qué?<textarea id="why" rows="3" placeholder="Una frase es suficiente"></textarea></label></div><p class="autosave">Guardado automático en este navegador.</p><div class="nav"><button id="back" class="secondary">Anterior</button><button id="next">Siguiente</button></div></section><section id="done" class="card hidden"><h1>Test completado</h1><p id="saveMessage">Guardando respuesta…</p><div id="remoteStatus" class="notice"></div><div class="actions"><button id="retrySave" class="hidden">Reintentar guardado</button><button id="download" class="secondary">Guardar copia JSON</button><button id="preview" class="secondary">Ver JSON</button></div><pre id="jsonPreview" class="json-preview hidden"></pre></section></main><script src="config.js"></script><script src="test.js"></script><script src="app.js"></script></body></html>
